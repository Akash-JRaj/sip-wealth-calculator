services:
  otel-lgtm:
    image: grafana/otel-lgtm:latest
    container_name: otel-lgtm
    ports:
      - "3000:3000"   # Grafana UI (http://localhost:3000)
      - "4317:4317"   # OTel Collector gRPC
      - "4318:4318"   # OTel Collector HTTP (OTLP/HTTP for web browsers & curl)
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - lgtm-data:/data
    restart: unless-stopped

  traffic-generator:
    image: node:22-alpine
    container_name: sip-traffic-generator
    working_dir: /app
    volumes:
      - .:/app
    environment:
      - OTLP_COLLECTOR_URL=http://otel-lgtm:4318
    command: ["node", "scripts/traffic-generator.js", "--loop"]
    depends_on:
      - otel-lgtm
    restart: unless-stopped

volumes:
  lgtm-data:
