<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Icon Container -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5" />

  <!-- Compounding Growth Bars -->
  <rect x="12" y="38" width="8" height="14" rx="2.5" fill="#4338CA" />
  <rect x="23" y="30" width="8" height="22" rx="2.5" fill="#6366F1" />
  <rect x="34" y="22" width="8" height="30" rx="2.5" fill="#059669" />
  <rect x="45" y="14" width="8" height="38" rx="2.5" fill="url(#barGrad)" />

  <!-- Exponential Trending Curve Line -->
  <path d="M12 40 Q 28 34, 48 16" fill="none" stroke="#FDE047" stroke-width="3" stroke-linecap="round" filter="url(#glow)" />

  <!-- Peak Wealth Indicator -->
  <circle cx="48" cy="16" r="3.5" fill="#10B981" stroke="#FFFFFF" stroke-width="1.5" />
</svg>
