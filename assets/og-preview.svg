<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <defs>
    <linearGradient id="canvasBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="brandTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="50%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#2DD4BF" />
    </linearGradient>
    <linearGradient id="curveGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="60%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#FDE047" />
    </linearGradient>
    <linearGradient id="areaFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#canvasBg)" />
  <circle cx="200" cy="150" r="300" fill="#6366F1" opacity="0.08" filter="blur(80px)" />
  <circle cx="1000" cy="450" r="350" fill="#10B981" opacity="0.08" filter="blur(90px)" />

  <!-- Grid overlay -->
  <g opacity="0.06" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="360" x2="1200" y2="360" />
    <line x1="0" y1="480" x2="1200" y2="480" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Compounding Curve Area Fill -->
  <path d="M 650 520 Q 820 480, 950 360 T 1150 160 L 1150 520 Z" fill="url(#areaFill)" />
  <path d="M 650 520 Q 820 480, 950 360 T 1150 160" fill="none" stroke="url(#curveGrad)" stroke-width="6" stroke-linecap="round" />

  <!-- Glowing Milestone Dots on curve -->
  <circle cx="850" cy="450" r="7" fill="#6366F1" stroke="#FFFFFF" stroke-width="2" />
  <circle cx="950" cy="360" r="8" fill="#10B981" stroke="#FFFFFF" stroke-width="2.5" />
  <circle cx="1070" cy="240" r="9" fill="#F59E0B" stroke="#FFFFFF" stroke-width="3" />
  <circle cx="1150" cy="160" r="11" fill="#10B981" stroke="#FFFFFF" stroke-width="3.5" />

  <!-- Badge Top Left -->
  <g transform="translate(100, 90)">
    <rect width="240" height="38" rx="19" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
    <circle cx="20" cy="19" r="5" fill="#10B981" />
    <text x="36" y="24" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">SMART WEALTH PLANNER</text>
  </g>

  <!-- Big Brand Heading -->
  <text x="100" y="210" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="900" letter-spacing="-1.5">
    Smart SIP Calculator
  </text>
  <text x="100" y="280" fill="url(#brandTextGrad)" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="800" letter-spacing="-0.5">
    Maximize Returns with Step-Up Compounding
  </text>

  <!-- Description -->
  <text x="100" y="340" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="400">
    Multi-currency financial modeling with inflation adjustment, milestones, &amp; roadmaps.
  </text>

  <!-- 3 Feature Chips -->
  <g transform="translate(100, 420)">
    <!-- Chip 1 -->
    <rect x="0" y="0" width="160" height="48" rx="12" fill="#1E293B" stroke="#475569" stroke-width="1" />
    <text x="24" y="29" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700">⚡ Step-Up SIP</text>

    <!-- Chip 2 -->
    <rect x="180" y="0" width="210" height="48" rx="12" fill="#1E293B" stroke="#475569" stroke-width="1" />
    <text x="204" y="29" fill="#34D399" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700">📉 Inflation Adjusted</text>

    <!-- Chip 3 -->
    <rect x="410" y="0" width="190" height="48" rx="12" fill="#1E293B" stroke="#475569" stroke-width="1" />
    <text x="434" y="29" fill="#FBBF24" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700">🌍 Multi-Currency</text>
  </g>

  <!-- Domain Tag Bottom -->
  <g transform="translate(100, 530)">
    <text x="0" y="0" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600">
      Available 24/7 on Vercel: <tspan fill="#F8FAFC">thesipcalculator.vercel.app</tspan>
    </text>
  </g>
</svg>
